<!-- 1. Random Password Generator – JavaScript Logic Requirements
Core Functionalities
• Generate random passwords dynamically
• User can select password length
• User can choose whether to include:
- Uppercase letters
- Lowercase letters
- Numbers
- Special characters
• Password should generate based on selected options only
• Ensure generated password length matches user input
• Prevent password generation if no option is selected
• Provide functionality to copy password
Password Storage
• Implement password storing functionality using Local Storage
• Stored passwords should include:
- Generated password
- Created date/time
- Optional label/category
Password Management Features
• View all saved passwords
• Delete saved passwords
• Search/filter saved passwords
• Prevent duplicate password entries
Password Strength Logic
• Check strength based on:
- Password length
- Variety of character types
- Special character inclusion
Strength Levels
• Weak
• Medium
• Strong
Validation Requirements
• Minimum password length: 4
• Maximum password length: 50
• Handle invalid inputs properly
• Show proper error messages -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="randompass.css">
</head>
<body>
    <script src="randomepas_script.js"></script>
    <h1 align="center">Random Password Genrator</h1>

    <table border="1" align="center">
        <tr>
            <td>Enter length you have create the pass</td>
            <td>
                <input type="number" name="" id="length" placeholder="Enter length">
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="checkbox" name="Uppercase" id="uppercase">
                <label for="">Choose Uppercase</label>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="checkbox" name="lowercase" id="lowercase">
                <label for="">Choose Lowercase</label>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="checkbox" name="" id="specialchars">
                <label for="">Choose Special Character</label>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="checkbox" name="" id="number">
                <label for="">Choose Number</label>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="text" name="" id="password" readonly>
                <!-- <button onclick="copypassword()">Copy</button> -->
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <button onclick="copypassword()">Copy</button>
                <button onclick="passwordgenrate()">Generate Password</button>
                <button onclick="savepassword()">Save Password</button>
            </td>
        </tr>
    </table>
</body>
</html>
